[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Dominion_ML"
version = "0.1.0"
description = "Reinforcement learning for training a bot to play Dominion."
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyminion_master*", ]